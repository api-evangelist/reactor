aid: reactor
name: Reactor
description: >-
  Reactor is a real-time video AI platform that streams generative video from
  GPU-hosted models to web and mobile applications over WebRTC, with sub-second
  round-trip latency and no infrastructure to manage. Developers connect through
  a JavaScript/React SDK or an async Python SDK, mint short-lived session tokens
  from a long-lived account API key, and control generation with a command/event
  channel (set_prompt, start, pause, reset). Its model catalog includes Helios
  (interactive real-time generation), SANA-Streaming (video-to-video editing),
  LingBot and LingBot World 2 (navigable worlds), X2, LongLive-2.0 and
  HappyOyster. Reactor is backed by Amplify Partners and Lightspeed Venture
  Partners and is currently in public beta.
